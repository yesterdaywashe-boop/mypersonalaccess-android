# MypersonalAccess — Android APK auto-build (GitHub Actions) — v3
#
# v2 se farq (2026-11-09 ~13:10 PKT):
# - `gradle/actions/setup-gradle` HATA DIYA — wahi step GitHub ke kharab
#   cache service se 504/400 kha raha tha. Ab Gradle seedha services.gradle.org
#   se download hota hai (curl, retry ke saath) — GitHub ki cache service se
#   iska koi lena dena nahi. Download ke baad `gradle --version` se verify
#   bhi hota hai ke Gradle theek install hua.
# - Baaki sab v2 jaisa hai: setup-java v5, SDK install (loud + verify),
#   assembleDebug, APK upload.

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.7
        run: |
          curl --retry 3 --retry-delay 5 -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          ls -la /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH
          /tmp/gradle-8.7/bin/gradle --version

      - name: Install Android SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          echo "--- build-tools check ---"
          ls "$ANDROID_HOME/build-tools/34.0.0" | head -5
          echo "--- platform check ---"
          ls -d "$ANDROID_HOME/platforms/android-34"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mypersonalaccess-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
