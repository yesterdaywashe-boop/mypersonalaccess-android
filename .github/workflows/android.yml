# MypersonalAccess — Android APK auto-build (GitHub Actions) — v2
#
# v1 se farq:
# - setup-java v4 -> v5 (v4 deprecated hai)
# - SDK install ab ghalti chhupata nahi: pehle licences accept karta hai,
#   phir platform 34 + build-tools 34.0.0 install karta hai, phir CHECK karta
#   hai ke dono folders waqai maujood hain. Agar SDK masla hai to log mein
#   saaf nazar aayega ke kya missing hai.
# - Baaki sab same hai (Gradle 8.7, assembleDebug, APK upload).

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Install Android SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          echo "--- build-tools check ---"
          ls "$ANDROID_HOME/build-tools/34.0.0" | head -5
          echo "--- platform check ---"
          ls -d "$ANDROID_HOME/platforms/android-34"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mypersonalaccess-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
