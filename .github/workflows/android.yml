# MypersonalAccess — Android APK auto-build (GitHub Actions) — v5
#
# v4 se farq (2026-11-09 ~14:07 PKT):
# - v4 ka `find ... -maxdepth 2` GHALAT tha: sdkmanager is raaste par hai
#   cmdline-tools/latest/bin/sdkmanager — yani depth 3 par, jabke maxdepth 2
#   sirf depth 2 tak dhoondta hai. Isi liye "not found" aaya jabke "latest"
#   folder maujood tha (log se saaf nazar aaya).
# - Ab pehle seedha path check hota hai (latest/bin/sdkmanager), phir sahi
#   depth (3) par find, aur latest/bin ki listing bhi print hoti hai taake
#   sab kuch log mein nazar aaye.
# - Baaki sab v4 jaisa hai: Gradle seedha gradle.org se (curl), setup-java v5,
#   SDK install + verify, assembleDebug, APK upload.

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.7
        run: |
          curl --retry 3 --retry-delay 5 -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          ls -la /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH
          /tmp/gradle-8.7/bin/gradle --version

      - name: Install Android SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          ls "$ANDROID_HOME/cmdline-tools/latest/bin" || true
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager found at: $SDKMANAGER"
          test -n "$SDKMANAGER" || { echo "ERROR: sdkmanager not found under $ANDROID_HOME/cmdline-tools"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          echo "--- build-tools check ---"
          ls "$ANDROID_HOME/build-tools/34.0.0" | head -5
          echo "--- platform check ---"
          ls -d "$ANDROID_HOME/platforms/android-34"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mypersonalaccess-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
